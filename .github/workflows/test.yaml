name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # One Python version; Ubuntu latest and Windows.
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install client dependencies
        run: python -m pip install requests beautifulsoup4

      # The suites are offline; a dead proxy turns any accidental request to a service
      # into a failure. tests/run_all.py discovers tests/test_skill_meta.py and every
      # tests/<skill>/test_*.py, so a new skill needs no workflow edit.
      - name: Run offline test suites
        env: {HTTP_PROXY: "http://127.0.0.1:9", HTTPS_PROXY: "http://127.0.0.1:9"}
        run: python -B tests/run_all.py
