name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19, which may not get builds of
    # Python 3.9, the oldest version the skills support.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.9"
          - os: ubuntu-24.04
            python: "3.14"
          - os: windows-latest
            python: "3.13"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install client dependencies
        run: python -m pip install requests beautifulsoup4
      # The suites are offline; a dead proxy turns any accidental request to a service
      # into a failure. tests/run_all.py discovers tests/test_skill_meta.py and every
      # tests/<skill>/test_*.py, so a new skill needs no workflow edit.
      - name: Run offline test suites
        env: {HTTP_PROXY: "http://127.0.0.1:9", HTTPS_PROXY: "http://127.0.0.1:9"}
        run: python -B tests/run_all.py
